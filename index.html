<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendataan Ruang</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --primary-blue: #007bff;
      --dark-navy: #03091e;
      --bg-light: #f4f6f9;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-light);
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background-color: var(--dark-navy);
      color: #fff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hero-banner {
      background-color: var(--primary-blue);
      color: white;
      padding: 30px 20px;
      border-radius: 0 0 20px 20px;
      margin-bottom: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      background-color: var(--primary-blue);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }
    button.outline {
      background: transparent;
      border: 2px solid var(--primary-blue);
      color: var(--primary-blue);
    }
    .hidden { display: none; }
    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #ffc107;
      color: #000;
    }
    .status-badge.synced {
      background: #28a745;
      color: #fff;
    }
    .data-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div style="font-weight: bold; font-size: 18px;">ISS Space Data</div>
    <div id="connectionStatus" class="status-badge">Online</div>
  </header>

  <!-- Container Utama -->
  <div class="container">

    <!-- View Login -->
    <div id="loginView" class="card">
      <h2>Masuk Sistem</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Masukkan ID User/Admin">
      </div>
      <div class="form-group">
        <label>PIN Akses</label>
        <input type="password" id="loginPin" placeholder="****">
      </div>
      <button onclick="handleLogin()">Masuk</button>
    </div>

    <!-- View App (Main Area) -->
    <div id="appView" class="hidden">
      <div class="hero-banner">
        <h2 style="margin:0;">Form Pendataan Ruang</h2>
        <p style="margin:5px 0 0 0; font-size:14px;">Input data ruang kerja dan fasilitas.</p>
      </div>

      <!-- Form Input Utama -->
      <div class="card">
        <form id="roomForm">
          <!-- Kolom Utama (Wajib Tampil Sesuai Permintaan) -->
          <div class="form-group">
            <label>Nama Ruang *</label>
            <input type="text" id="namaRuang" required>
          </div>
          <div class="form-group">
            <label>Luas Ruang (m²) *</label>
            <input type="number" id="luasRuang" required>
          </div>
          <div class="form-group">
            <label>Jenis Permukaan Lantai *</label>
            <input type="text" id="jenisLantai" placeholder="cth: Keramik, Karpet, Epoxy" required>
          </div>

          <!-- Opsi Toggle Opsional -->
          <button type="button" class="outline" style="margin-bottom:15px;" onclick="toggleOptionalFields()">
            + Tampilkan Detail Lainnya (Gedung/Lantai/Catatan)
          </button>

          <!-- Kolom Tambahan (Hidden by Default) -->
          <div id="optionalFields" class="hidden">
            <div class="form-group">
              <label>Nama Gedung</label>
              <input type="text" id="namaGedung">
            </div>
            <div class="form-group">
              <label>Lantai</label>
              <input type="text" id="lantai">
            </div>
            <div class="form-group">
              <label>Catatan</label>
              <textarea id="catatan" rows="3"></textarea>
            </div>
          </div>

          <button type="submit">Simpan Data</button>
        </form>
      </div>

      <!-- Tabel/List Data -->
      <div class="card">
        <h3>Daftar Data Ruang</h3>
        <button class="outline" style="margin-bottom: 10px;" onclick="syncOfflineData()">Sinkronkan Data Sekarang</button>
        <div id="dataList"></div>
      </div>

      <button onclick="handleLogout()" style="background-color: #dc3545; margin-top:20px;">Keluar</button>
    </div>

  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw0t3vA-Dn4ObxsTANZQC9lRKnFZime-u3uPHaH2B999eSltFlKCBVe200c4XPmY3JZ/exec";

    let db;
    let currentUser = null;

    // 1. Inisialisasi Offline DB (IndexedDB)
    const request = indexedDB.open("SpaceAppDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      db.createObjectStore("rooms", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => { db = e.target.result; };

    // Detection Offline/Online Status
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function updateOnlineStatus() {
      const status = document.getElementById('connectionStatus');
      if (navigator.onLine) {
        status.innerText = "Online";
        status.classList.add("synced");
        syncOfflineData(); // Auto sync saat kembali online
      } else {
        status.innerText = "Offline Mode";
        status.classList.remove("synced");
      }
    }

    // Toggle Field Opsional UI
    function toggleOptionalFields() {
      const el = document.getElementById('optionalFields');
      el.classList.toggle('hidden');
    }

    // 2. Authentication
    async function handleLogin() {
      const username = document.getElementById('loginUser').value;
      const pin = document.getElementById('loginPin').value;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', username, pin })
        });
        const data = await res.json();

        if (data.status === 'success') {
          currentUser = { username: data.username, role: data.role };
          localStorage.setItem('user', JSON.stringify(currentUser));
          showAppView();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Gagal login. Pastikan koneksi internet tersedia saat pertama kali login.");
      }
    }

    function showAppView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appView').classList.remove('hidden');
      renderDataList();
    }

    function handleLogout() {
      localStorage.removeItem('user');
      location.reload();
    }

    // 3. Simpan Data (Offline First)
    document.getElementById('roomForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        namaRuang: document.getElementById('namaRuang').value,
        luasRuang: document.getElementById('luasRuang').value,
        jenisLantai: document.getElementById('jenisLantai').value,
        namaGedung: document.getElementById('namaGedung').value || "-",
        lantai: document.getElementById('lantai').value || "-",
        catatan: document.getElementById('catatan').value || "-",
        synced: false
      };

      // Simpan ke IndexedDB lokal
      const tx = db.transaction("rooms", "readwrite");
      tx.objectStore("rooms").add(payload);
      
      document.getElementById('roomForm').reset();
      alert("Data tersimpan di penyimpanan lokal!");
      
      renderDataList();

      if (navigator.onLine) {
        syncOfflineData();
      }
    });

    // 4. Render & Edit Data
    function renderDataList() {
      const dataList = document.getElementById('dataList');
      dataList.innerHTML = "";

      const tx = db.transaction("rooms", "readonly");
      const store = tx.objectStore("rooms");
      store.openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const item = cursor.value;
          const div = document.createElement('div');
          div.className = "data-item";
          div.innerHTML = `
            <strong>${item.namaGedung} - Lantai ${item.lantai} - ${item.namaRuang}</strong><br>
            <small>Luas: ${item.luasRuang} m² | Permukaan: ${item.jenisLantai}</small><br>
            <small>Catatan: ${item.catatan}</small><br>
            <span class="status-badge ${item.synced ? 'synced' : ''}">${item.synced ? 'Tersinkron' : 'Belum Sinkron'}</span>
          `;
          dataList.appendChild(div);
          cursor.continue();
        }
      };
    }

    // 5. Sinkronisasi Data ke Backend GAS
    async function syncOfflineData() {
      if (!navigator.onLine || !currentUser) return;

      const tx = db.transaction("rooms", "readwrite");
      const store = tx.objectStore("rooms");
      const unsynced = [];

      store.openCursor().onsuccess = async (e) => {
        const cursor = e.target.result;
        if (cursor) {
          if (!cursor.value.synced) {
            unsynced.push(cursor.value);
          }
          cursor.continue();
        } else if (unsynced.length > 0) {
          // Kirim ke GAS
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({
              action: 'syncData',
              username: currentUser.username,
              records: unsynced
            })
          });
          
          const result = await res.json();
          if (result.status === 'success') {
            // Update status local db
            const writeTx = db.transaction("rooms", "readwrite");
            const writeStore = writeTx.objectStore("rooms");
            unsynced.forEach(item => {
              item.synced = true;
              writeStore.put(item);
            });
            renderDataList();
          }
        }
      };
    }
  </script>
</body>
</html>
