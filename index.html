<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pendataan Ruang</title>
  <!-- Manifest & PWA Support -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0066FF">
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
  <style>
    .bg-corporate { background-color: #0066FF; }
    .text-corporate { color: #0066FF; }
    .border-corporate { border-color: #0066FF; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

  <!-- App Container -->
  <div id="app" class="min-h-screen flex flex-col">
    
    <!-- Header -->
    <header class="bg-corporate text-white p-4 shadow-md flex justify-between items-center">
      <h1 class="text-lg font-bold">Space Inventory App</h1>
      <div id="user-info" class="text-sm hidden">
        <span id="lbl-username" class="font-semibold"></span> | 
        <button onclick="logout()" class="underline hover:text-gray-200">Keluar</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 max-w-lg mx-auto w-full">
      
      <!-- VIEW: LOGIN -->
      <section id="view-login" class="bg-white p-6 rounded-xl shadow-md mt-10">
        <h2 class="text-xl font-bold mb-4 text-corporate">Login Pengguna</h2>
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Username / ID User</label>
          <input type="text" id="login-user" class="w-full p-3 border rounded-lg focus:outline-none border-corporate" placeholder="Contoh: user1">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-bold mb-2">PIN Akses</label>
          <input type="password" id="login-pin" class="w-full p-3 border rounded-lg focus:outline-none border-corporate" placeholder="Masukkan PIN">
        </div>
        <button onclick="login()" class="w-full bg-corporate text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Masuk</button>
      </section>

      <!-- VIEW: DASHBOARD / FORM INPUT -->
      <section id="view-dashboard" class="hidden">
        
        <!-- Status Koneksi & Sinkronisasi -->
        <div id="sync-status" class="mb-4 p-2 text-center text-xs rounded font-semibold bg-yellow-100 text-yellow-800">
          Status: <span id="conn-text">Online</span> | Antrean Offline: <span id="queue-count">0</span>
        </div>

        <!-- Form Input Card -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-6">
          <h2 id="form-title" class="text-lg font-bold mb-4 text-corporate">Input Ruang Baru</h2>
          <input type="hidden" id="edit-id">
          
          <!-- Field Utama (Wajib Tampil Sesuai Permintaan Poin 2) -->
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Nama Ruang *</label>
            <input type="text" id="inp-ruang" class="w-full p-3 border rounded-lg focus:outline-none" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Luas Ruang (m2) *</label>
            <input type="number" step="0.01" id="inp-luas" class="w-full p-3 border rounded-lg focus:outline-none" required>
          </div>

          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">Jenis Permukaan Lantai *</label>
            <input type="text" id="inp-permukaan" class="w-full p-3 border rounded-lg focus:outline-none" placeholder="Contoh: Keramik, Vinyl, Semen" required>
          </div>

          <!-- Kolom Tambahan (Muncul Bila Dibutuhkan / Tombol Toggle) -->
          <button type="button" onclick="toggleExtraFields()" class="text-sm text-corporate font-semibold mb-4 underline focus:outline-none">
            + Tambah Detail Gedung & Catatan (Opsional)
          </button>

          <div id="extra-fields" class="hidden space-y-4 mb-4 border-t pt-4">
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">Nama Gedung</label>
              <input type="text" id="inp-gedung" class="w-full p-3 border rounded-lg focus:outline-none">
            </div>
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">Lantai</label>
              <input type="text" id="inp-lantai" class="w-full p-3 border rounded-lg focus:outline-none">
            </div>
            <div>
              <label class="block text-gray-700 text-sm font-bold mb-2">Catatan</label>
              <textarea id="inp-catatan" class="w-full p-3 border rounded-lg focus:outline-none"></textarea>
            </div>
          </div>

          <button onclick="saveData()" class="w-full bg-corporate text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">Simpan Data</button>
          <button onclick="resetForm()" class="w-full mt-2 bg-gray-300 text-gray-700 p-2 rounded-lg text-sm">Batal / Reset</button>
        </div>

        <!-- Data Tersimpan (Struktur: Nama Gedung - Lantai - Nama Ruang - Luas - Permukaan - Catatan) -->
        <div class="bg-white p-6 rounded-xl shadow-md">
          <h2 class="text-lg font-bold mb-4 text-corporate">Daftar Ruang Tersimpan</h2>
          <div id="data-list" class="space-y-3">
            <!-- Data akan dimuat secara dinamis via JavaScript -->
          </div>
        </div>

      </section>

    </main>
  </div>

  <!-- SCRIPT LOGIKA APLIKASI & OFFLINE SYNC -->
  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbw0t3vA-Dn4ObxsTANZQC9lRKnFZime-u3uPHaH2B999eSltFlKCBVe200c4XPmY3JZ/exec";
    
    let currentUser = localStorage.getItem("currentUser") || null;
    let currentRole = localStorage.getItem("currentRole") || null;

    window.onload = function() {
      if (currentUser) {
        showDashboard();
        loadData();
      }
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus();
    };

    function updateOnlineStatus() {
      const isOnline = navigator.onLine;
      const connText = document.getElementById("conn-text");
      const queue = JSON.parse(localStorage.getItem("offlineQueue") || "[]");
      
      document.getElementById("queue-count").innerText = queue.length;
      if (isOnline) {
        connText.innerText = "Online";
        connText.className = "text-green-600 font-bold";
        if (queue.length > 0) syncOfflineData();
      } else {
        connText.innerText = "Offline (Tersimpan Lokal)";
        connText.className = "text-red-600 font-bold";
      }
    }

    function toggleExtraFields() {
      const extra = document.getElementById("extra-fields");
      extra.classList.toggle("hidden");
    }

    async function login() {
      let user = document.getElementById("login-user").value.trim();
      let pin = document.getElementById("login-pin").value.trim();
      
      if(!user || !pin) {
        alert("Harap isi username dan PIN!");
        return;
      }

      try {
        let response = await fetch(WEB_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", username: user, pin: pin })
        });
        let res = await response.json();
        
        if (res.status === "success") {
          currentUser = res.username;
          currentRole = res.role;
          localStorage.setItem("currentUser", currentUser);
          localStorage.setItem("currentRole", currentRole);
          showDashboard();
          loadData();
        } else {
          alert(res.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server (Cek koneksi internet saat login pertama).");
      }
    }

    function logout() {
      localStorage.removeItem("currentUser");
      localStorage.removeItem("currentRole");
      currentUser = null;
      currentRole = null;
      document.getElementById("view-dashboard").classList.add("hidden");
      document.getElementById("view-login").classList.remove("hidden");
      document.getElementById("user-info").classList.add("hidden");
    }

    function showDashboard() {
      document.getElementById("view-login").classList.add("hidden");
      document.getElementById("view-dashboard").classList.remove("hidden");
      document.getElementById("user-info").classList.remove("hidden");
      document.getElementById("lbl-username").innerText = currentUser;
    }

    async function saveData() {
      let payload = {
        id: document.getElementById("edit-id").value || ("ID_" + Date.now()),
        ruang: document.getElementById("inp-ruang").value,
        luas: document.getElementById("inp-luas").value,
        permukaan: document.getElementById("inp-permukaan").value,
        gedung: document.getElementById("inp-gedung").value || "-",
        lantai: document.getElementById("inp-lantai").value || "-",
        catatan: document.getElementById("inp-catatan").value || "-"
      };

      if(!payload.ruang || !payload.luas || !payload.permukaan) {
        alert("Mohon lengkapi kolom utama (Nama Ruang, Luas, Jenis Permukaan)!");
        return;
      }

      // Simpan ke local cache untuk tampilan instan & offline support
      let localData = JSON.parse(localStorage.getItem("data_" + currentUser) || "[]");
      let index = localData.findIndex(item => item.id === payload.id);
      if(index >= 0) {
        localData[index] = payload;
      } else {
        localData.push(payload);
      }
      localStorage.setItem("data_" + currentUser, JSON.stringify(localData));

      if (navigator.onLine) {
        try {
          await fetch(WEB_URL, {
            method: "POST",
            body: JSON.stringify({ action: "saveData", username: currentUser, payload: payload })
          });
          alert("Data berhasil disimpan ke Cloud!");
        } catch(e) {
          queueOffline(payload);
        }
      } else {
        queueOffline(payload);
        alert("Jaringan offline. Data tersimpan di perangkat dan akan disinkronkan nanti.");
      }

      resetForm();
      renderDataList(localData);
    }

    function queueOffline(payload) {
      let queue = JSON.parse(localStorage.getItem("offlineQueue") || "[]");
      queue.push({ username: currentUser, payload: payload });
      localStorage.setItem("offlineQueue", JSON.stringify(queue));
      updateOnlineStatus();
    }

    async function syncOfflineData() {
      let queue = JSON.parse(localStorage.getItem("offlineQueue") || "[]");
      if (queue.length === 0) return;

      let remainingQueue = [];
      for (let item of queue) {
        try {
          await fetch(WEB_URL, {
            method: "POST",
            body: JSON.stringify({ action: "saveData", username: item.username, payload: item.payload })
          });
        } catch (e) {
          remainingQueue.push(item);
        }
      }
      localStorage.setItem("offlineQueue", JSON.stringify(remainingQueue));
      updateOnlineStatus();
    }

    async function loadData() {
      if (navigator.onLine) {
        try {
          let response = await fetch(WEB_URL, {
            method: "POST",
            body: JSON.stringify({ action: "getData", username: currentUser })
          });
          let res = await response.json();
          if (res.status === "success") {
            localStorage.setItem("data_" + currentUser, JSON.stringify(res.data));
            renderDataList(res.data);
            return;
          }
        } catch(e) {
          console.log("Gagal ambil dari server, menggunakan cache lokal.");
        }
      }
      // Fallback lokal
      let localData = JSON.parse(localStorage.getItem("data_" + currentUser) || "[]");
      renderDataList(localData);
    }

    function renderDataList(data) {
      let container = document.getElementById("data-list");
      container.innerHTML = "";
      if(data.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-sm">Belum ada data tersimpan.</p>`;
        return;
      }
      
      data.forEach(item => {
        let div = document.createElement("div");
        div.className = "p-3 border rounded-lg bg-gray-50 text-sm flex justify-between items-start";
        div.innerHTML = `
          <div>
            <p class="font-bold text-corporate">${item.gedung} - Lantai ${item.lantai} - ${item.ruang}</p>
            <p class="text-gray-600">Luas: ${item.luas} m2 | Lantai: ${item.permukaan}</p>
            <p class="text-gray-500 italic text-xs">Catatan: ${item.catatan}</p>
          </div>
          <button onclick='editData(${JSON.stringify(item)})' class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Edit</button>
        `;
        container.appendChild(div);
      });
    }

    function editData(item) {
      document.getElementById("edit-id").value = item.id;
      document.getElementById("inp-ruang").value = item.ruang;
      document.getElementById("inp-luas").value = item.luas;
      document.getElementById("inp-permukaan").value = item.permukaan;
      document.getElementById("inp-gedung").value = item.gedung;
      document.getElementById("inp-lantai").value = item.lantai;
      document.getElementById("inp-catatan").value = item.catatan;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById("edit-id").value = "";
      document.getElementById("inp-ruang").value = "";
      document.getElementById("inp-luas").value = "";
      document.getElementById("inp-permukaan").value = "";
      document.getElementById("inp-gedung").value = "";
      document.getElementById("inp-lantai").value = "";
      document.getElementById("inp-catatan").value = "";
    }
  </script>
</body>
</html>
