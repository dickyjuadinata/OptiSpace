<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Survey App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'iss-blue': '#003366',
                        'iss-light': '#e6f0fa'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-iss-blue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">📋</span>
                <h1 class="text-xl font-bold tracking-wide">Room Survey App</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="navUserBtn" onclick="switchView('user')" class="px-3 py-1.5 rounded-lg bg-white text-iss-blue font-semibold text-sm hover:bg-gray-100 transition">User Dashboard</button>
                <button id="navAdminBtn" onclick="switchView('admin')" class="px-3 py-1.5 rounded-lg text-white font-semibold text-sm hover:bg-blue-800 transition">Admin Dashboard</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- User Auth & Project Header -->
        <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap gap-4 justify-between items-center">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <div>
                    <label class="block text-xs text-gray-500 font-semibold mb-1">USER / SURVEYOR</label>
                    <input type="text" id="currentUser" value="User1" onchange="onUserOrProjectChange()" class="p-2 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue font-semibold bg-gray-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 font-semibold mb-1">PROJECT</label>
                    <div class="flex gap-2">
                        <input type="text" id="currentProject" list="projectList" value="Gedung Utama" onchange="onUserOrProjectChange()" placeholder="Pilih / Buat Project" class="p-2 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue font-semibold bg-gray-50 text-sm">
                        <datalist id="projectList"></datalist>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="syncStatus" class="text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-medium">Ready</span>
                <button onclick="syncDataWithServer()" class="bg-iss-blue text-white px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90 transition">🔄 Sync Server</button>
            </div>
        </div>

        <!-- USER VIEW SECTION -->
        <section id="userSection" class="space-y-6">
            <!-- Form Input -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <h2 id="formTitle" class="text-lg font-bold text-iss-blue mb-4">Input Data Ruang Baru</h2>
                <form id="surveyForm" onsubmit="saveRoomData(event)" class="space-y-4">
                    <input type="hidden" id="editIndex" value="">
                    <input type="hidden" id="insertIndex" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Nama Ruang *</label>
                            <input type="text" id="nama_ruang" list="ruangList" required placeholder="Ketik / pilih ruang..." class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue bg-white">
                            <datalist id="ruangList"></datalist>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Luas Ruang (m²) *</label>
                            <input type="number" step="0.01" inputmode="decimal" id="luas_ruang" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Jenis Permukaan Lantai *</label>
                            <input type="text" id="jenis_permukaan" list="jenisPermukaanList" required placeholder="Ketik / pilih jenis..." class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue bg-white">
                            <datalist id="jenisPermukaanList">
                                <option value="Keramik"></option>
                                <option value="Vinyl"></option>
                                <option value="Karpet"></option>
                                <option value="Epoxy"></option>
                                <option value="Parket"></option>
                                <option value="Semen/Beton"></option>
                                <option value="Granit"></option>
                                <option value="Lainnya"></option>
                            </datalist>
                        </div>
                    </div>

                    <div class="border-t pt-4">
                        <button type="button" onclick="toggleExtraFields()" class="text-iss-blue text-sm font-semibold flex items-center gap-1">
                            ⚙️ Tambah Informasi Detail (Gedung, Lantai, Catatan)
                        </button>
                        <div id="extraFields" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nama Gedung</label>
                                <input type="text" id="gedung" list="gedungList" placeholder="Ketik / pilih gedung..." class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue bg-white">
                                <datalist id="gedungList"></datalist>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Lantai</label>
                                <input type="text" id="lantai" list="lantaiList" placeholder="Ketik / pilih lantai..." class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue bg-white">
                                <datalist id="lantaiList"></datalist>
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-sm font-medium text-gray-700">Catatan</label>
                                <textarea id="catatan" class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue" rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" class="flex-1 bg-iss-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Simpan Data</button>
                        <button type="button" onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-300 text-gray-700 px-4 py-3 rounded-xl font-semibold hover:bg-gray-400 transition">Batal</button>
                    </div>
                </form>
            </div>

            <!-- User Table View -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-gray-700">Daftar Data Ruang Terinput</h3>
                    <span id="rowCount" class="text-xs bg-iss-blue text-white px-2.5 py-1 rounded-full font-semibold">0 Ruang</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-100 text-gray-600 border-b">
                            <tr>
                                <th class="p-3">Gedung</th>
                                <th class="p-3">Lantai</th>
                                <th class="p-3">Nama Ruang</th>
                                <th class="p-3">Luas (m²)</th>
                                <th class="p-3">Jenis Permukaan</th>
                                <th class="p-3">Catatan</th>
                                <th class="p-3 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <tr><td colspan="7" class="p-4 text-center text-gray-400">Belum ada data. Silakan isi form di atas.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ADMIN VIEW SECTION -->
        <section id="adminSection" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-iss-blue">Admin Dashboard - Monitoring Data User</h2>
                <button onclick="loadAdminData()" class="bg-iss-blue text-white px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90 transition">🔄 Refresh Admin Data</button>
            </div>
            <div id="adminCardsContainer" class="space-y-6">
                <p class="text-gray-500 italic">Memuat data admin...</p>
            </div>
        </section>

    </main>

    <!-- Javascript Logic -->
    <script>
        let currentUser = 'User1';
        let currentProject = 'Gedung Utama';

        window.onload = function() {
            currentUser = document.getElementById("currentUser").value.trim() || 'User1';
            currentProject = document.getElementById("currentProject").value.trim() || 'Gedung Utama';
            renderTable();
            syncDataWithServer();
        };

        function switchView(view) {
            const userSec = document.getElementById("userSection");
            const adminSec = document.getElementById("adminSection");
            const navUserBtn = document.getElementById("navUserBtn");
            const navAdminBtn = document.getElementById("navAdminBtn");

            if (view === 'user') {
                userSec.classList.remove("hidden");
                adminSec.classList.add("hidden");
                navUserBtn.className = "px-3 py-1.5 rounded-lg bg-white text-iss-blue font-semibold text-sm hover:bg-gray-100 transition";
                navAdminBtn.className = "px-3 py-1.5 rounded-lg text-white font-semibold text-sm hover:bg-blue-800 transition";
            } else {
                userSec.classList.add("hidden");
                adminSec.classList.remove("hidden");
                navAdminBtn.className = "px-3 py-1.5 rounded-lg bg-white text-iss-blue font-semibold text-sm hover:bg-gray-100 transition";
                navUserBtn.className = "px-3 py-1.5 rounded-lg text-white font-semibold text-sm hover:bg-blue-800 transition";
                loadAdminData();
            }
        }

        function onUserOrProjectChange() {
            currentUser = document.getElementById("currentUser").value.trim() || 'User1';
            currentProject = document.getElementById("currentProject").value.trim() || 'Gedung Utama';
            renderTable();
            syncDataWithServer();
        }

        function toggleExtraFields() {
            const extra = document.getElementById("extraFields");
            extra.classList.toggle("hidden");
        }

        function getLocalData() {
            if (!currentUser || !currentProject) return [];
            const dataStr = localStorage.getItem(`data_${currentUser}_${currentProject}`);
            return dataStr ? JSON.parse(dataStr) : [];
        }

        function saveLocalData(data) {
            if (!currentUser || !currentProject) return;
            const stampedData = data.map((item, idx) => ({
                ...item,
                updated_at: item.updated_at || Date.now(),
                order_index: idx
            }));
            localStorage.setItem(`data_${currentUser}_${currentProject}`, JSON.stringify(stampedData));
        }

        function updateDatalists() {
            const rows = getLocalData();
            const gedungs = [...new Set(rows.map(r => r.gedung).filter(Boolean))];
            const lantais = [...new Set(rows.map(r => r.lantai).filter(Boolean))];
            const ruangs = [...new Set(rows.map(r => r.nama_ruang).filter(Boolean))];
            
            document.getElementById("gedungList").innerHTML = gedungs.map(g => `<option value="${g}">`).join('');
            document.getElementById("lantaiList").innerHTML = lantais.map(l => `<option value="${l}">`).join('');
            document.getElementById("ruangList").innerHTML = ruangs.map(r => `<option value="${r}">`).join('');
        }

        function renderTable() {
            const rows = getLocalData();
            const tbody = document.getElementById("dataTableBody");
            document.getElementById("rowCount").innerText = `${rows.length} Ruang`;
            tbody.innerHTML = "";

            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-400">Belum ada data terinput pada project ini.</td></tr>`;
                updateDatalists();
                return;
            }

            rows.forEach((r, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">${r.gedung || '-'}</td>
                        <td class="p-3">${r.lantai || '-'}</td>
                        <td class="p-3 font-medium text-gray-900">${r.nama_ruang}</td>
                        <td class="p-3 font-semibold">${r.luas_ruang}</td>
                        <td class="p-3">${r.jenis_permukaan}</td>
                        <td class="p-3 text-gray-500">${r.catatan || '-'}</td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="editRow(${index})" class="text-blue-600 hover:underline font-medium">Edit</button>
                            <button onclick="insertRow(${index})" class="text-green-600 hover:underline font-medium">Sisip</button>
                            <button onclick="deleteRow(${index})" class="text-red-600 hover:underline font-medium">Hapus</button>
                        </td>
                    </tr>
                `;
            });
            
            updateDatalists();
        }

        function saveRoomData(e) {
            e.preventDefault();
            if (!currentProject) return;

            const editIndex = document.getElementById("editIndex").value;
            const insertIndex = document.getElementById("insertIndex").value;
            
            const newItem = {
                gedung: document.getElementById("gedung").value.trim(),
                lantai: document.getElementById("lantai").value.trim(),
                nama_ruang: document.getElementById("nama_ruang").value.trim(),
                luas_ruang: parseFloat(document.getElementById("luas_ruang").value) || 0,
                jenis_permukaan: document.getElementById("jenis_permukaan").value.trim(),
                catatan: document.getElementById("catatan").value.trim(),
                updated_at: Date.now()
            };

            let rows = getLocalData();
            
            if (editIndex !== "") {
                rows[parseInt(editIndex)] = newItem;
            } else if (insertIndex !== "") {
                rows.splice(parseInt(insertIndex), 0, newItem);
            } else {
                rows.push(newItem);
            }

            saveLocalData(rows);
            resetForm();
            renderTable();
            syncDataWithServer();
        }

        function editRow(index) {
            const rows = getLocalData();
            const item = rows[index];
            if (!item) return;

            document.getElementById("editIndex").value = index;
            document.getElementById("insertIndex").value = "";
            document.getElementById("gedung").value = item.gedung || "";
            document.getElementById("lantai").value = item.lantai || "";
            document.getElementById("nama_ruang").value = item.nama_ruang || "";
            document.getElementById("luas_ruang").value = item.luas_ruang || 0;
            document.getElementById("jenis_permukaan").value = item.jenis_permukaan || "";
            document.getElementById("catatan").value = item.catatan || "";

            document.getElementById("formTitle").innerText = `Edit Data Ruang (Baris #${index + 1})`;
            document.getElementById("cancelBtn").classList.remove("hidden");
            document.getElementById("extraFields").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function insertRow(index) {
            resetForm();
            document.getElementById("insertIndex").value = index;
            document.getElementById("formTitle").innerText = `Sisipkan Data Sebelum Baris #${index + 1}`;
            document.getElementById("cancelBtn").classList.remove("hidden");
            document.getElementById("extraFields").classList.remove("hidden");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRow(index) {
            if (confirm("Apakah Anda yakin ingin menghapus baris data ini?")) {
                let rows = getLocalData();
                rows.splice(index, 1);
                saveLocalData(rows);
                renderTable();
                syncDataWithServer();
            }
        }

        function resetForm() {
            document.getElementById("surveyForm").reset();
            document.getElementById("editIndex").value = "";
            document.getElementById("insertIndex").value = "";
            document.getElementById("formTitle").innerText = "Input Data Ruang Baru";
            document.getElementById("cancelBtn").classList.add("hidden");
        }

        function setSyncStatus(msg, type = "info") {
            const statusEl = document.getElementById("syncStatus");
            statusEl.innerText = msg;
            if (type === "success") {
                statusEl.className = "text-xs bg-green-100 text-green-700 px-3 py-1.5 rounded-full font-medium";
            } else if (type === "error") {
                statusEl.className = "text-xs bg-red-100 text-red-700 px-3 py-1.5 rounded-full font-medium";
            } else {
                statusEl.className = "text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full font-medium";
            }
        }

        function syncDataWithServer() {
            if (typeof google === 'undefined' || !google.script) {
                setSyncStatus("Mode Lokal / Pratinjau", "info");
                return;
            }

            setSyncStatus("Menyinkronkan...", "info");
            const localRows = getLocalData();

            const payload = {
                action: 'saveData',
                username: currentUser,
                project: currentProject,
                rows: localRows
            };

            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.status === 'success') {
                        setSyncStatus("Tersinkronisasi", "success");
                        google.script.run
                            .withSuccessHandler(function(getRes) {
                                if (getRes && getRes.status === 'success') {
                                    if (getRes.projects) {
                                        document.getElementById("projectList").innerHTML = getRes.projects.map(p => `<option value="${p}">`).join('');
                                    }
                                    if (getRes.rows) {
                                        saveLocalData(getRes.rows);
                                        renderTable();
                                    }
                                }
                            })
                            .apiPost({ action: 'getData', username: currentUser, project: currentProject });
                    } else {
                        setSyncStatus("Gagal Sync", "error");
                    }
                })
                .withFailureHandler(function(err) {
                    setSyncStatus("Offline / Error", "error");
                })
                .apiPost(payload);
        }

        function loadAdminData() {
            const container = document.getElementById("adminCardsContainer");
            container.innerHTML = "<p class='text-gray-500 italic'>Memuat data seluruh user...</p>";

            if (typeof google === 'undefined' || !google.script) {
                container.innerHTML = "<p class='text-amber-600 font-semibold'>Mode Pratinjau: Hubungkan dengan Google Apps Script backend untuk melihat data admin nyata.</p>";
                return;
            }

            google.script.run
                .withSuccessHandler(function(res) {
                    if (res && res.status === 'success') {
                        renderAdminDashboard(res.usersData || []);
                    } else {
                        container.innerHTML = "<p class='text-red-500 font-semibold'>Gagal memuat data admin.</p>";
                    }
                })
                .withFailureHandler(function(err) {
                    container.innerHTML = `<p class='text-red-500 font-semibold'>Error: ${err.message}</p>`;
                })
                .apiPost({ action: 'getAdminData' });
        }

        function toggleAdminCard(idx) {
            const content = document.getElementById(`adminCardContent_${idx}`);
            const icon = document.getElementById(`adminCardIcon_${idx}`);
            if (content.classList.contains("hidden")) {
                content.classList.remove("hidden");
                icon.innerText = "▲";
            } else {
                content.classList.add("hidden");
                icon.innerText = "▼";
            }
        }

        function renderAdminDashboard(usersData) {
            const container = document.getElementById("adminCardsContainer");
            if (usersData.length === 0) {
                container.innerHTML = "<p class='text-gray-500'>Belum ada data user tersimpan.</p>";
                return;
            }

            let html = "";
            usersData.forEach((u, idx) => {
                let propagatedRows = u.rows || [];
                
                let totalLuas = 0;
                let perGedung = {};
                let namaSamaPerGedung = {}; 
                let perPermukaanGedung = {}; 

                propagatedRows.forEach(r => {
                    let luas = parseFloat(r.luas_ruang) || 0;
                    totalLuas += luas;

                    let gedung = r.gedung ? r.gedung.trim() : "Tanpa Gedung";
                    perGedung[gedung] = (perGedung[gedung] || 0) + luas;

                    let namaRuang = r.nama_ruang ? r.nama_ruang.trim() : "Lainnya";
                    if (!namaSamaPerGedung[gedung]) namaSamaPerGedung[gedung] = {};
                    if (!namaSamaPerGedung[gedung][namaRuang]) {
                        namaSamaPerGedung[gedung][namaRuang] = { totalLuas: 0, count: 0 };
                    }
                    namaSamaPerGedung[gedung][namaRuang].totalLuas += luas;
                    namaSamaPerGedung[gedung][namaRuang].count += 1;

                    let perm = r.jenis_permukaan ? r.jenis_permukaan.trim() : "Lainnya";
                    if (!perPermukaanGedung[gedung]) perPermukaanGedung[gedung] = {};
                    perPermukaanGedung[gedung][perm] = (perPermukaanGedung[gedung][perm] || 0) + luas;
                });

                let htmlGedung = "";
                for (let g in perGedung) {
                    let prop = totalLuas > 0 ? ((perGedung[g] / totalLuas) * 100).toFixed(1) : 0;
                    htmlGedung += `<div class="flex justify-between border-b pb-1"><span>${g}</span><span class="font-semibold">${perGedung[g].toFixed(2)} m² (${prop}%)</span></div>`;
                }

                let htmlNamaSama = "";
                for (let g in namaSamaPerGedung) {
                    htmlNamaSama += `<div class="font-semibold text-iss-blue mt-2 mb-1">Gedung: ${g}</div>`;
                    for (let nr in namaSamaPerGedung[g]) {
                        htmlNamaSama += `<div class="flex justify-between border-b pb-1 pl-2 text-xs"><span>${nr} (${namaSamaPerGedung[g][nr].count} ruang)</span><span>${namaSamaPerGedung[g][nr].totalLuas.toFixed(2)} m²</span></div>`;
                    }
                }

                let htmlPerm = "";
                for (let g in perPermukaanGedung) {
                    htmlPerm += `<div class="font-semibold text-iss-blue mt-2 mb-1">Gedung: ${g}</div>`;
                    let totalGedungLuas = perGedung[g] || 1;
                    for (let p in perPermukaanGedung[g]) {
                        let propPerm = ((perPermukaanGedung[g][p] / totalGedungLuas) * 100).toFixed(1);
                        htmlPerm += `<div class="flex justify-between border-b pb-1 pl-2 text-xs"><span>${p}</span><span>${perPermukaanGedung[g][p].toFixed(2)} m² (${propPerm}%)</span></div>`;
                    }
                }

                html += `
                    <div class="border rounded-2xl p-6 bg-white shadow-sm space-y-4">
                        <div class="flex justify-between items-center border-b pb-3 cursor-pointer" onclick="toggleAdminCard(${idx})">
                            <div class="flex items-center gap-3">
                                <h4 class="font-bold text-xl text-iss-blue">User: ${u.user}</h4>
                                <span id="adminCardIcon_${idx}" class="text-sm font-bold text-iss-blue">▼</span>
                            </div>
                            <span class="bg-blue-100 text-iss-blue px-3 py-1 rounded-full text-xs font-semibold">Total Luas: ${totalLuas.toFixed(2)} m² | Ruangan: ${propagatedRows.length}</span>
                        </div>
                        <div id="adminCardContent_${idx}" class="hidden space-y-4">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm">
                                    <p class="text-sm text-gray-600">Total Luas Area Terukur</p>
                                    <h4 class="text-2xl font-bold text-iss-blue">${totalLuas.toFixed(2)} m²</h4>
                                </div>
                                <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl shadow-sm">
                                    <p class="text-sm text-gray-600">Jumlah Ruangan</p>
                                    <h4 class="text-2xl font-bold text-iss-blue">${propagatedRows.length} Ruang</h4>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="bg-gray-50 p-4 rounded-xl border shadow-sm space-y-2">
                                    <h4 class="font-bold text-gray-700 border-b pb-1">Total Luas per Gedung</h4>
                                    <div class="space-y-2 text-sm">${htmlGedung || "<p class='text-gray-500'>Belum ada data</p>"}</div>
                                </div>
                                <div class="bg-gray-50 p-4 rounded-xl border shadow-sm space-y-2">
                                    <h4 class="font-bold text-gray-700 border-b pb-1">Luas Ruangan Nama Sama</h4>

                `;
