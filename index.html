<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Survey App - ISS Style</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .bg-iss-blue { background-color: #0066FF; }
        .text-iss-blue { color: #0066FF; }
        .border-iss-blue { border-color: #0066FF; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-iss-blue text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">Room Survey App</h1>
        <div id="userInfo" class="text-sm hidden">
            <span id="displayUser" class="font-semibold"></span> | 
            <button onclick="logout()" class="underline ml-2">Keluar</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow p-4 max-w-4xl mx-auto w-full">

        <!-- LOGIN SECTION -->
        <section id="loginSection" class="bg-white p-6 rounded-2xl shadow-lg max-w-md mx-auto mt-10">
            <h2 class="text-2xl font-bold text-iss-blue mb-6 text-center">Silakan Login</h2>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username / Role</label>
                    <input type="text" id="username" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none" placeholder="cth: user1 / admin">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">PIN Akses</label>
                    <input type="password" id="pin" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none" placeholder="Masukkan PIN">
                </div>
                <button type="submit" class="w-full bg-iss-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Masuk</button>
            </form>
        </section>

        <!-- DASHBOARD SECTION -->
        <section id="dashboardSection" class="hidden space-y-6">
            
            <!-- Connection Status Banner -->
            <div id="netStatus" class="p-2 text-center text-xs font-semibold rounded-lg bg-green-100 text-green-800">
                Status: Online (Tersinkronisasi)
            </div>

            <!-- Form Input / Edit Ruang -->
            <div class="bg-white p-6 rounded-2xl shadow-md">
                <h3 id="formTitle" class="text-xl font-bold text-iss-blue mb-4">Input Data Ruang Baru</h3>
                <form id="surveyForm" onsubmit="saveRoomData(event)" class="space-y-4">
                    <input type="hidden" id="editIndex" value="">
                    
                    <!-- UTAMA (Selalu Tampil) -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Nama Ruang *</label>
                            <input type="text" id="nama_ruang" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Luas Ruang (m²) *</label>
                            <input type="number" step="0.01" id="luas_ruang" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Jenis Permukaan Lantai *</label>
                            <input type="text" id="jenis_permukaan" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue" placeholder="Cth: Keramik, Vinyl">
                        </div>
                    </div>

                    <!-- TAMBAHAN (Muncul bila dibutuhkan / Expandable) -->
                    <div class="border-t pt-4">
                        <button type="button" onclick="toggleExtraFields()" class="text-iss-blue text-sm font-semibold flex items-center gap-1">
                            ⚙️ Tambah Informasi Detail (Gedung, Lantai, Catatan)
                        </button>
                        <div id="extraFields" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nama Gedung</label>
                                <input type="text" id="gedung" class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Lantai</label>
                                <input type="text" id="lantai" class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-sm font-medium text-gray-700">Catatan</label>
                                <textarea id="catatan" class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue" rows="2"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" class="flex-1 bg-iss-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Simpan Data</button>
                        <button type="button" onclick="resetForm()" id="cancelBtn" class="hidden bg-gray-300 text-gray-700 px-4 py-3 rounded-xl font-semibold">Batal</button>
                    </div>
                </form>
            </div>

            <!-- Tabel Data Tersimpan -->
            <div class="bg-white p-6 rounded-2xl shadow-md overflow-x-auto">
                <h3 class="text-xl font-bold text-iss-blue mb-4">Daftar Data Ruang Tersimpan</h3>
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-blue-50 text-iss-blue border-b">
                            <th class="p-3">Nama Gedung</th>
                            <th class="p-3">Lantai</th>
                            <th class="p-3">Nama Ruang</th>
                            <th class="p-3">Luas (m²)</th>
                            <th class="p-3">Jenis Permukaan</th>
                            <th class="p-3">Catatan</th>
                            <th class="p-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data terisi dinamis -->
                    </tbody>
                </table>
            </div>

        </section>
    </main>

    <!-- Script Logika & Offline Sync -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwo1qux80FXKobwTX727KuaBtcNoGnxoStbK6JaIBvt6VSrD2Brree4g5tFpD0IE-1V/exec";
        let currentUser = localStorage.getItem("survey_user") || null;

        window.onload = () => {
            if (currentUser) {
                showDashboard();
                loadData();
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();
        };

        function updateOnlineStatus() {
            const statusDiv = document.getElementById("netStatus");
            if (navigator.onLine) {
                statusDiv.className = "p-2 text-center text-xs font-semibold rounded-lg bg-green-100 text-green-800";
                statusDiv.innerText = "Status: Online (Menyinkronkan data offline jika ada...)";
                syncOfflineData();
            } else {
                statusDiv.className = "p-2 text-center text-xs font-semibold rounded-lg bg-yellow-100 text-yellow-800";
                statusDiv.innerText = "Status: Offline (Data akan disimpan secara lokal di perangkat Anda)";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const pin = document.getElementById("pin").value;

            try {
                let response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username, pin })
                });
                let result = await response.json();

                if (result.status === "success") {
                    currentUser = username;
                    localStorage.setItem("survey_user", username);
                    showDashboard();
                    loadData();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Gagal terhubung ke server. Periksa koneksi internet.");
            }
        }

        function logout() {
            localStorage.removeItem("survey_user");
            location.reload();
        }

        function showDashboard() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("dashboardSection").classList.remove("hidden");
            document.getElementById("userInfo").classList.remove("hidden");
            document.getElementById("displayUser").innerText = currentUser;
        }

        function toggleExtraFields() {
            const extra = document.getElementById("extraFields");
            extra.classList.toggle("hidden");
        }

        function getLocalData() {
            return JSON.parse(localStorage.getItem(`data_${currentUser}`)) || [];
        }

        function saveLocalData(data) {
            localStorage.setItem(`data_${currentUser}`, JSON.stringify(data));
        }

        async function loadData() {
            if (navigator.onLine) {
                try {
                    let res = await fetch(API_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "getData", username: currentUser })
                    });
                    let json = await res.json();
                    if (json.status === "success") {
                        saveLocalData(json.rows);
                    }
                } catch (e) {
                    console.log("Mengambil dari penyimpanan lokal (offline mode)");
                }
            }
            renderTable();
        }

        function renderTable() {
            const rows = getLocalData();
            const tbody = document.getElementById("dataTableBody");
            tbody.innerHTML = "";

            rows.forEach((r, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3">${r.gedung || '-'}</td>
                        <td class="p-3">${r.lantai || '-'}</td>
                        <td class="p-3 font-medium">${r.nama_ruang}</td>
                        <td class="p-3">${r.luas_ruang}</td>
                        <td class="p-3">${r.jenis_permukaan}</td>
                        <td class="p-3">${r.catatan || '-'}</td>
                        <td class="p-3 text-center space-x-2">
                            <button onclick="editRow(${index})" class="text-blue-600 underline">Edit</button>
                            <button onclick="deleteRow(${index})" class="text-red-600 underline">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveRoomData(e) {
            e.preventDefault();
            const editIndex = document.getElementById("editIndex").value;
            
            const newItem = {
                gedung: document.getElementById("gedung").value,
                lantai: document.getElementById("lantai").value,
                nama_ruang: document.getElementById("nama_ruang").value,
                luas_ruang: document.getElementById("luas_ruang").value,
                jenis_permukaan: document.getElementById("jenis_permukaan").value,
                catatan: document.getElementById("catatan").value
            };

            let rows = getLocalData();
            if (editIndex === "") {
                rows.push(newItem);
            } else {
                rows[editIndex] = newItem;
            }

            saveLocalData(rows);
            resetForm();
            renderTable();
            syncOfflineData();
        }

        function editRow(index) {
            const rows = getLocalData();
            const r = rows[index];

            document.getElementById("editIndex").value = index;
            document.getElementById("gedung").value = r.gedung || "";
            document.getElementById("lantai").value = r.lantai || "";
            document.getElementById("nama_ruang").value = r.nama_ruang;
            document.getElementById("luas_ruang").value = r.luas_ruang;
            document.getElementById("jenis_permukaan").value = r.jenis_permukaan;
            document.getElementById("catatan").value = r.catatan || "";

            document.getElementById("formTitle").innerText = "Edit Data Ruang";
            document.getElementById("cancelBtn").classList.remove("hidden");
            document.getElementById("extraFields").classList.remove("hidden");
        }

        function deleteRow(index) {
            if (confirm("Hapus data ini?")) {
                let rows = getLocalData();
                rows.splice(index, 1);
                saveLocalData(rows);
                renderTable();
                syncOfflineData();
            }
        }

        function resetForm() {
            document.getElementById("surveyForm").reset();
            document.getElementById("editIndex").value = "";
            document.getElementById("formTitle").innerText = "Input Data Ruang Baru";
            document.getElementById("cancelBtn").classList.add("hidden");
        }

        async function syncOfflineData() {
            if (!navigator.onLine || !currentUser) return;
            const rows = getLocalData();
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "saveData", username: currentUser, rows: rows })
                });
            } catch (e) {
                console.error("Sinkronisasi gagal:", e);
            }
        }
    </script>
</body>
</html>
