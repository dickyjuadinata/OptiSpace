<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pendataan Ruang</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0066FF',
            primaryHover: '#0052CC',
            darkBg: '#050B14'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="bg-primary text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-lg font-bold tracking-wide">Space Inventory PWA</h1>
      <div id="userInfo" class="text-sm hidden">
        <span id="displayUser" class="bg-blue-700 px-3 py-1 rounded-full"></span>
        <button onclick="logout()" class="ml-2 bg-red-500 px-3 py-1 rounded hover:bg-red-600">Keluar</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-4xl w-full mx-auto p-4">

    <!-- LOGIN SECTION -->
    <section id="loginSection" class="bg-white rounded-2xl shadow-xl p-6 max-w-md mx-auto mt-10 border border-gray-100">
      <div class="text-center mb-6">
        <div class="bg-blue-50 text-primary w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold">🏢</div>
        <h2 class="text-2xl font-bold text-gray-900">Silakan Masuk</h2>
        <p class="text-sm text-gray-500">Aplikasi Pendataan Ruang Gedung</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Role</label>
          <select id="role" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none" onchange="toggleUsernameField()">
            <option value="user">User / Petugas</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div id="usernameWrapper">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nama / ID Pengguna</label>
          <input type="text" id="username" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none" placeholder="cth: Budi">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PIN Akses</label>
          <input type="password" id="pin" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan PIN">
        </div>
        <button type="submit" class="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-primaryHover transition">Masuk Aplikasi</button>
      </form>
    </section>

    <!-- APP DASHBOARD SECTION -->
    <section id="appSection" class="hidden space-y-6">
      
      <!-- Status Koneksi & Sinkronisasi -->
      <div id="syncStatus" class="bg-yellow-50 border border-yellow-200 text-yellow-800 px-4 py-2 rounded-lg text-sm flex justify-between items-center hidden">
        <span id="syncText">⚠️ Anda sedang offline. Data tersimpan secara lokal.</span>
        <button onclick="syncData()" id="syncBtn" class="bg-yellow-600 text-white px-3 py-1 rounded text-xs hover:bg-yellow-700">Sinkronkan</button>
      </div>

      <!-- Form Input Ruangan -->
      <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
        <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">📝 Form Input Data Ruang</h3>
        <form id="roomForm" onsubmit="saveRoom(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          
          <!-- Field Utama yang Selalu Muncul -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Ruang *</label>
            <input type="text" id="nama_ruang" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Luas Ruang (m²) *</label>
            <input type="number" step="0.01" id="luas_ruang" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none">
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Permukaan Lantai *</label>
            <input type="text" id="jenis_permukaan" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary outline-none" placeholder="cth: Keramik, Vinyl, Semen">
          </div>

          <!-- Tombol Opsi Tambahan Kolom -->
          <div class="md:col-span-2">
            <button type="button" onclick="toggleExtraFields()" class="text-sm text-primary font-medium hover:underline flex items-center gap-1">
              ➕ Tampilkan Kolom Tambahan (Gedung, Lantai, Catatan)
            </button>
          </div>

          <!-- Kolom Opsional -->
          <div id="extraFields" class="hidden md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-gray-50 rounded-lg border">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Nama Gedung</label>
              <input type="text" id="gedung" class="w-full border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Lantai</label>
              <input type="text" id="lantai" class="w-full border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-primary outline-none">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
              <textarea id="catatan" rows="2" class="w-full border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-primary outline-none"></textarea>
            </div>
          </div>

          <div class="md:col-span-2">
            <button type="submit" class="w-full bg-primary text-white py-2.5 rounded-lg font-semibold hover:bg-primaryHover transition">Simpan Data Ruangan</button>
          </div>
        </form>
      </div>

      <!-- Tabel Data Tersimpan -->
      <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-gray-800">📊 Data Ruang Tersimpan</h3>
          <button onclick="fetchData()" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm hover:bg-gray-200">Muat Ulang</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-gray-100 text-gray-700 border-b">
                <th class="p-3">Gedung</th>
                <th class="p-3">Lantai</th>
                <th class="p-3">Nama Ruang</th>
                <th class="p-3">Luas (m²)</th>
                <th class="p-3">Permukaan</th>
                <th class="p-3">Catatan</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="dataTableBody">
              <!-- Render via Javascript -->
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </main>

  <footer class="text-center py-4 text-xs text-gray-400">
    &copy; 2026 Space Inventory PWA. All rights reserved.
  </footer>

  <!-- Script Logika Aplikasi & Offline Sync -->
  <script>
    const WEB_APP_URL = "GANTI_DENGAN_URL_WEB_APP_GAS_ANDA"; // Masukkan Web App URL di sini
    let currentUser = null;
    let currentRole = null;
    let localData = JSON.parse(localStorage.getItem('local_room_data') || '[]');

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    function updateOnlineStatus() {
      const banner = document.getElementById('syncStatus');
      if (navigator.onLine) {
        banner.classList.add('hidden');
        syncData();
      } else {
        banner.classList.remove('hidden');
        document.getElementById('syncText').innerText = "⚠️ Offline Mode. Data tersimpan di perangkat lokal.";
      }
    }
    updateOnlineStatus();

    function toggleUsernameField() {
      const role = document.getElementById('role').value;
      const usernameWrapper = document.getElementById('usernameWrapper');
      if (role === 'admin') {
        usernameWrapper.style.display = 'none';
        document.getElementById('username').value = 'admin';
      } else {
        usernameWrapper.style.display = 'block';
        document.getElementById('username').value = '';
      }
    }

    function toggleExtraFields() {
      const extra = document.getElementById('extraFields');
      extra.classList.toggle('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const username = document.getElementById('username').value || 'admin';
      const pin = document.getElementById('pin').value;

      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'login', role, pin, username })
        });
        const result = await response.json();

        if (result.status === 'success') {
          currentUser = username;
          currentRole = role;
          document.getElementById('displayUser').innerText = `${role.toUpperCase()}: ${username}`;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');
          document.getElementById('userInfo').classList.remove('hidden');
          fetchData();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke server (Cek koneksi internet / URL GAS).");
      }
    }

    function logout() {
      currentUser = null;
      currentRole = null;
      document.getElementById('appSection').classList.add('hidden');
      document.getElementById('userInfo').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('loginForm').reset();
    }

    async function saveRoom(e) {
      e.preventDefault();
      const newRow = {
        gedung: document.getElementById('gedung').value || '-',
        lantai: document.getElementById('lantai').value || '-',
        nama_ruang: document.getElementById('nama_ruang').value,
        luas_ruang: document.getElementById('luas_ruang').value,
        jenis_permukaan: document.getElementById('jenis_permukaan').value,
        catatan: document.getElementById('catatan').value || '-'
      };

      localData.push(newRow);
      localStorage.setItem('local_room_data', JSON.stringify(localData));
      document.getElementById('roomForm').reset();
      renderTable(localData);

      if (navigator.onLine) {
        syncData();
      } else {
        alert("Data tersimpan secara lokal karena offline. Akan disinkronkan saat online.");
      }
    }

    async function syncData() {
      if (!navigator.onLine || !currentUser) return;
      try {
        const response = await fetch(WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveData', username: currentUser, role: currentRole, rows: localData })
        });
        const res = await response.json();
        if(res.status === 'success') {
          console.log("Sinkronisasi berhasil.");
        }
      } catch(err) {
        console.error("Sinkronisasi gagal:", err);
      }
    }

    async function fetchData() {
      if (navigator.onLine && currentUser) {
        try {
          const response = await fetch(WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getData', username: currentUser, role: currentRole })
          });
          const res = await response.json();
          if (res.status === 'success') {
            localData = res.data;
            localStorage.setItem('local_room_data', JSON.stringify(localData));
          }
        } catch (err) {
          console.error("Gagal mengambil data online, menggunakan lokal.");
        }
      }
      renderTable(localData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-gray-400">Belum ada data tersimpan.</td></tr>`;
        return;
      }
      data.forEach((item, index) => {
        tbody.innerHTML += `
          <tr class="border-b hover:bg-gray-50">
            <td class="p-3">${item.gedung}</td>
            <td class="p-3">${item.lantai}</td>
            <td class="p-3 font-medium text-gray-900">${item.nama_ruang}</td>
            <td class="p-3">${item.luas_ruang}</td>
            <td class="p-3">${item.jenis_permukaan}</td>
            <td class="p-3 text-gray-500">${item.catatan}</td>
            <td class="p-3 text-center">
              <button onclick="editRow(${index})" class="text-blue-600 hover:underline mr-2">Edit</button>
              <button onclick="deleteRow(${index})" class="text-red-600 hover:underline">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    function deleteRow(index) {
      if(confirm('Hapus data ruang ini?')) {
        localData.splice(index, 1);
        localStorage.setItem('local_room_data', JSON.stringify(localData));
        renderTable(localData);
        syncData();
      }
    }

    function editRow(index) {
      const item = localData[index];
      document.getElementById('gedung').value = item.gedung;
      document.getElementById('lantai').value = item.lantai;
      document.getElementById('nama_ruang').value = item.nama_ruang;
      document.getElementById('luas_ruang').value = item.luas_ruang;
      document.getElementById('jenis_permukaan').value = item.jenis_permukaan;
      document.getElementById('catatan').value = item.catatan;
      
      // Hapus item lama saat diedit lalu simpan ulang
      localData.splice(index, 1);
      renderTable(localData);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
