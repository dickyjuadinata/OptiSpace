<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Survey App - ISS Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .bg-iss-blue { background-color: #0066FF; }
        .text-iss-blue { color: #0066FF; }
        .border-iss-blue { border-color: #0066FF; }

        .searchable-dropdown-container { position: relative; width: 100%; }
        .searchable-dropdown-list {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
            background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 0.75rem;
            margin-top: 0.25rem; max-height: 200px; overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: none;
        }
        .searchable-dropdown-item { padding: 0.75rem 1rem; cursor: pointer; font-size: 0.875rem; color: #374151; }
        .searchable-dropdown-item:hover, .searchable-dropdown-item.active-item { background-color: #eff6ff; color: #0066FF; font-weight: 600; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #0066FF; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col relative">

    <div id="loadingOverlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-xs z-50 flex flex-col items-center justify-center hidden">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center gap-3">
            <div class="spinner"></div>
            <p id="loadingText" class="text-sm font-semibold text-gray-700">Memproses data...</p>
        </div>
    </div>

    <button id="scrollToTopBtn" onclick="scrollToTop()" class="fixed bottom-6 right-6 bg-iss-blue text-white p-3.5 rounded-full shadow-lg transition-all duration-300 hidden opacity-0 z-40">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
    </button>

    <header class="bg-iss-blue text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">Room Survey App</h1>
        <div id="userInfo" class="text-sm hidden items-center gap-2">
            <span id="displayUser" class="font-semibold"></span> | 
            <button onclick="switchView('dashboard')" id="navDashboardBtn" class="underline">Dashboard</button>
            <button onclick="switchView('survey')" id="navSurveyBtn" class="underline hidden">Survey</button>
            <button onclick="downloadExcel()" id="navDownloadExcelBtn" class="underline hidden">Download Excel</button>
            <button onclick="downloadPpt()" id="navDownloadPptBtn" class="underline hidden">Download PPT</button>
            <button onclick="logout()" class="underline ml-2">Keluar</button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full">
        <section id="loginSection" class="bg-white p-6 rounded-2xl shadow-lg max-w-md mx-auto mt-10">
            <div class="flex border-b mb-6">
                <button type="button" onclick="switchAuthTab('login')" id="tabLoginBtn" class="flex-1 pb-3 font-bold text-iss-blue border-b-2 border-iss-blue">Login</button>
                <button type="button" onclick="switchAuthTab('register')" id="tabRegisterBtn" class="flex-1 pb-3 font-medium text-gray-400">Daftar Akun</button>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div><label class="block text-sm font-medium text-gray-700">Username / Role</label><input type="text" id="username" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">PIN Akses</label><input type="password" id="pin" inputmode="numeric" pattern="[0-9]*" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none"></div>
                <button type="submit" class="w-full bg-iss-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Masuk</button>
            </form>
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div><label class="block text-sm font-medium text-gray-700">Username Baru</label><input type="text" id="regUsername" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none"></div>
                <div><label class="block text-sm font-medium text-gray-700">PIN Unik</label><input type="password" id="regPin" inputmode="numeric" pattern="[0-9]*" required class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-iss-blue outline-none"></div>
                <button type="submit" class="w-full bg-iss-blue text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">Daftar Sekarang</button>
            </form>
        </section>

        <section id="dashboardSection" class="hidden space-y-6">
            <div id="netStatus" class="p-2 text-center text-xs font-semibold rounded-lg bg-green-100 text-green-800">Status: Online</div>

            <div id="tabSurvey" class="hidden space-y-6">
                <!-- Tombol Ringkas Project Aktif -->
                <div class="bg-white p-4 rounded-2xl shadow-md flex justify-between items-center">
                    <div>
                        <span class="text-xs text-gray-500 block">Project Aktif:</span>
                        <span id="activeProjectBadge" class="text-lg font-bold text-iss-blue">-</span>
                    </div>
                    <button type="button" onclick="openProjectModal()" class="bg-iss-blue text-white px-4 py-2 rounded-xl text-sm font-semibold hover:opacity-90 transition">Pilih / Ganti</button>
                </div>

                <!-- Modal Pop-up -->
                <div id="projectModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4">
                    <div class="bg-white w-full max-w-lg p-6 rounded-2xl shadow-2xl relative">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="font-bold text-lg text-iss-blue">Pilih atau Buat Project</h2>
                            <button type="button" onclick="closeProjectModal()" class="text-gray-400 text-2xl">&times;</button>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Pilih Project</label>
                                <input type="text" id="selectProject" placeholder="Ketik untuk mencari..." class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                            </div>
                            <div class="text-center text-sm text-gray-400">ATAU</div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Buat Project Baru</label>
                                <div class="flex gap-2">
                                    <input type="text" id="newProjectInput" placeholder="Nama project..." class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-iss-blue">
                                    <button type="button" onclick="createNewProject(); closeProjectModal();" class="bg-iss-blue text-white px-4 py-3 rounded-xl font-semibold">Tambah</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form & Tabel ... (Kode existing lainnya tetap sama) -->
                <div class="bg-white p-6 rounded-2xl shadow-md" id="surveyFormCard">
                    <!-- (Isi form survey Anda tetap di sini) -->
                </div>
            </div>
            
            <!-- (Isi tabDashboard lainnya tetap di sini) -->
        </section>
    </main>

    <script>
        // FUNGSI BARU UNTUK MODAL
        function openProjectModal() { document.getElementById('projectModal').classList.remove('hidden'); }
        function closeProjectModal() { document.getElementById('projectModal').classList.add('hidden'); }

        // ... (Tambahkan sisa script Anda di sini) ...
    </script>
</body>
</html>
