<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pendataan Ruang</title>
    <!-- Manifest untuk PWA / Homescreen -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <!-- Tailwind CSS untuk styling cepat & responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#e6f0ff', 500: '#007bff', 600: '#0056b3', 700: '#004085' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- HEADER -->
        <header class="bg-brand-500 text-white shadow-md p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Pendataan Ruang</h1>
            <div id="user-info" class="text-sm hidden">
                <span id="lbl-user" class="mr-2 font-medium"></span>
                <button onclick="logout()" class="bg-brand-700 px-3 py-1 rounded text-xs hover:bg-brand-600">Keluar</button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-grow p-4 max-w-4xl mx-auto w-full">
            
            <!-- VIEW: LOGIN -->
            <section id="view-login" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md mt-10 border-t-4 border-brand-500">
                <h2 class="text-2xl font-bold mb-6 text-brand-700 text-center">Silakan Login</h2>
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Role</label>
                        <select id="login-role" onchange="toggleRoleFields()" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-brand-500">
                            <option value="user">User / Petugas</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div id="field-username">
                        <label class="block text-sm font-medium text-gray-700">Nama User</label>
                        <input type="text" id="login-username" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="cth: petugas_gedung_a">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">PIN Akses</label>
                        <input type="password" id="login-pin" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-brand-500" placeholder="Masukkan PIN">
                    </div>
                    <button type="submit" class="w-full bg-brand-500 text-white py-2 rounded-lg font-semibold hover:bg-brand-600 transition">Masuk</button>
                </form>
            </section>

            <!-- VIEW: DASHBOARD / INPUT & DATA -->
            <section id="view-dashboard" class="hidden space-y-6">
                
                <!-- Status Koneksi -->
                <div id="connection-status" class="p-2 text-center text-xs font-semibold rounded bg-green-100 text-green-800">
                    Status: Online (Menyinkronkan)
                </div>

                <!-- Form Input / Edit Ruang -->
                <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-brand-500">
                    <h3 id="form-title" class="text-lg font-bold mb-4 text-brand-700">Tambah Data Ruang</h3>
                    <form id="form-ruang" onsubmit="saveRuang(event)" class="space-y-4">
                        <input type="hidden" id="edit-index" value="">
                        
                        <!-- Kolom Utama (Selalu Muncul) -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nama Ruang *</label>
                                <input type="text" id="nama-ruang" required class="w-full mt-1 p-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Luas Ruang (m²) *</label>
                                <input type="number" step="0.01" id="luas-ruang" required class="w-full mt-1 p-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Jenis Permukaan Lantai *</label>
                                <input type="text" id="jenis-lantai" required class="w-full mt-1 p-2 border rounded-lg" placeholder="Cth: Keramik, Vinyl">
                            </div>
                        </div>

                        <!-- Kolom Tambahan (Muncul bila dibutuhkan / tombol toggle) -->
                        <div>
                            <button type="button" onclick="toggleExtraFields()" class="text-sm text-brand-600 font-medium hover:underline">
                                + Tambah Info Detail (Gedung, Lantai, Catatan)
                            </button>
                        </div>

                        <div id="extra-fields" class="hidden grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Nama Gedung</label>
                                <input type="text" id="nama-gedung" class="w-full mt-1 p-2 border rounded-lg">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Lantai</label>
                                <input type="text" id="lantai" class="w-full mt-1 p-2 border rounded-lg">
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-sm font-medium text-gray-700">Catatan</label>
                                <textarea id="catatan" class="w-full mt-1 p-2 border rounded-lg"></textarea>
                            </div>
                        </div>

                        <div class="flex space-x-2">
                            <button type="submit" class="bg-brand-500 text-white px-4 py-2 rounded-lg font-semibold hover:bg-brand-600">Simpan Data</button>
                            <button type="button" onclick="resetForm()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400">Batal / Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Tabel Data Tersimpan -->
                <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
                    <h3 class="text-lg font-bold mb-4 text-brand-700">Daftar Ruang Terdata</h3>
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-brand-50 text-brand-700 border-b">
                                <th class="p-2">Gedung</th>
                                <th class="p-2">Lantai</th>
                                <th class="p-2">Nama Ruang</th>
                                <th class="p-2">Luas (m²)</th>
                                <th class="p-2">Permukaan</th>
                                <th class="p-2">Catatan</th>
                                <th class="p-2 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-data" class="divide-y">
                            <!-- Data dinamis via JS -->
                        </tbody>
                    </table>
                </div>

            </section>
        </main>
    </div>

    <!-- SCRIPT APLIKASI & OFFLINE SYNC -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0t3vA-Dn4ObxsTANZQC9lRKnFZime-u3uPHaH2B999eSltFlKCBVe200c4XPmY3JZ/exec";
        
        let session = JSON.parse(localStorage.getItem("room_session")) || null;
        let localData = JSON.parse(localStorage.getItem("room_local_data")) || [];

        window.onload = function() {
            if (session) {
                showDashboard();
                syncData();
            }
            window.addEventListener('online', updateConnectionStatus);
            window.addEventListener('offline', updateConnectionStatus);
            updateConnectionStatus();
        };

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            if (navigator.onLine) {
                statusEl.className = "p-2 text-center text-xs font-semibold rounded bg-green-100 text-green-800";
                statusEl.innerText = "Status: Online (Terhubung ke Jaringan)";
                syncData();
            } else {
                statusEl.className = "p-2 text-center text-xs font-semibold rounded bg-yellow-100 text-yellow-800";
                statusEl.innerText = "Status: Offline (Data tersimpan lokal di perangkat)";
            }
        }

        function toggleRoleFields() {
            const role = document.getElementById('login-role').value;
            document.getElementById('field-username').style.display = role === 'admin' ? 'none' : 'block';
        }

        function toggleExtraFields() {
            const extra = document.getElementById('extra-fields');
            extra.classList.toggle('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('login-role').value;
            const username = document.getElementById('login-username').value;
            const pin = document.getElementById('login-pin').value;

            const payload = { action: "login", role, username, pin };

            try {
                let res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                let json = await res.json();

                if (json.status === "success") {
                    session = { username: role === 'admin' ? 'Admin' : username, role: json.role, spreadsheetId: json.spreadsheetId };
                    localStorage.setItem("room_session", JSON.stringify(session));
                    showDashboard();
                    syncData();
                } else {
                    alert("Login Gagal: " + json.message);
                }
            } catch (err) {
                alert("Gagal terhubung ke server (Pastikan koneksi internet aktif saat login pertama kali).");
            }
        }

        function logout() {
            localStorage.removeItem("room_session");
            session = null;
            location.reload();
        }

        function showDashboard() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('lbl-user').innerText = `${session.username} (${session.role})`;
        }

        async function syncData() {
            if (!navigator.onLine || !session) return;
            try {
                // Kirim data lokal ke server
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "saveData", spreadsheetId: session.spreadsheetId, rows: localData })
                });
                
                // Ambil data terbaru dari server
                let res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getData", spreadsheetId: session.spreadsheetId })
                });
                let json = await res.json();
                if (json.status === "success") {
                    localData = json.rows;
                    localStorage.setItem("room_local_data", JSON.stringify(localData));
                    renderTable();
                }
            } catch (err) {
                console.error("Sinkronisasi gagal:", err);
            }
        }

        function saveRuang(e) {
            e.preventDefault();
            const index = document.getElementById('edit-index').value;
            
            const rowItem = {
                "nama gedung": document.getElementById('nama-gedung').value,
                "lantai": document.getElementById('lantai').value,
                "nama ruang": document.getElementById('nama-ruang').value,
                "luas ruang": document.getElementById('luas-ruang').value,
                "jenis permukaan lantai": document.getElementById('jenis-lantai').value,
                "catatan": document.getElementById('catatan').value
            };

            if (index === "") {
                localData.push(rowItem);
            } else {
                localData[index] = rowItem;
                document.getElementById('edit-index').value = "";
                document.getElementById('form-title').innerText = "Tambah Data Ruang";
            }

            localStorage.setItem("room_local_data", JSON.stringify(localData));
            renderTable();
            resetForm();
            syncData(); // Coba sinkronisasi otomatis jika online
        }

        function renderTable() {
            const tbody = document.getElementById('table-data');
            tbody.innerHTML = "";
            localData.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2">${item["nama gedung"] || '-'}</td>
                        <td class="p-2">${item["lantai"] || '-'}</td>
                        <td class="p-2 font-medium">${item["nama ruang"]}</td>
                        <td class="p-2">${item["luas ruang"]}</td>
                        <td class="p-2">${item["jenis permukaan lantai"]}</td>
                        <td class="p-2 text-gray-500 text-xs">${item["catatan"] || '-'}</td>
                        <td class="p-2 text-center space-x-2">
                            <button onclick="editRow(${index})" class="text-blue-600 hover:underline">Edit</button>
                            <button onclick="deleteRow(${index})" class="text-red-600 hover:underline">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editRow(index) {
            const item = localData[index];
            document.getElementById('edit-index').value = index;
            document.getElementById('nama-gedung').value = item["nama gedung"] || "";
            document.getElementById('lantai').value = item["lantai"] || "";
            document.getElementById('nama-ruang').value = item["nama ruang"] || "";
            document.getElementById('luas-ruang').value = item["luas ruang"] || "";
            document.getElementById('jenis-lantai').value = item["jenis permukaan lantai"] || "";
            document.getElementById('catatan').value = item["catatan"] || "";
            
            document.getElementById('form-title').innerText = "Edit Data Ruang";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRow(index) {
            if (confirm("Yakin ingin menghapus data ini?")) {
                localData.splice(index, 1);
                localStorage.setItem("room_local_data", JSON.stringify(localData));
                renderTable();
                syncData();
            }
        }

        function resetForm() {
            document.getElementById('form-ruang').reset();
            document.getElementById('edit-index').value = "";
            document.getElementById('form-title').innerText = "Tambah Data Ruang";
        }
    </script>
</body>
</html>
