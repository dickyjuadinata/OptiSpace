<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pendataan Ruang</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0066FF">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-primary { background-color: #0066FF; }
        .text-primary { color: #0066FF; }
        .border-primary { border-color: #0066FF; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-6">
                <div class="bg-blue-50 text-primary w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold">🏢</div>
                <h1 class="text-2xl font-bold text-slate-900">Pendataan Ruang</h1>
                <p class="text-sm text-slate-500">Silakan masuk untuk melanjutkan</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username (user / admin)</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">PIN Akses</label>
                    <input type="password" id="pin" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                <button type="submit" class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-lg shadow-blue-500/30">Masuk</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appSection" class="hidden flex-grow flex flex-col">
        <!-- Navbar -->
        <header class="bg-primary text-white shadow-md">
            <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-lg font-bold">Sistem Pendataan Ruang</h1>
                <div class="flex items-center gap-3">
                    <span id="syncStatus" class="text-xs bg-blue-700 px-2 py-1 rounded-full">Online</span>
                    <button onclick="logout()" class="text-sm bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg transition">Keluar</button>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
            <!-- Form Input -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Form Input Ruangan</h2>
                <form id="roomForm" onsubmit="saveRoom(event)" class="space-y-4">
                    <input type="hidden" id="editId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Ruang *</label>
                            <input type="text" id="namaRuang" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Luas Ruang (m²) *</label>
                            <input type="number" step="0.01" id="luas" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Permukaan Lantai *</label>
                        <input type="text" id="permukaan" required placeholder="Contoh: Keramik, Vinyl, Semen" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Kolom Tambahan (Opsional) -->
                    <div>
                        <button type="button" onclick="toggleExtraFields()" id="toggleBtn" class="text-sm text-primary font-medium hover:underline">+ Tampilkan Nama Gedung, Lantai & Catatan</button>
                    </div>
                    <div id="extraFields" class="hidden space-y-4 pt-2 border-t border-slate-100">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Gedung</label>
                                <input type="text" id="gedung" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Lantai</label>
                                <input type="text" id="lantai" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Catatan</label>
                            <textarea id="catatan" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-primary text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-md">Simpan Data</button>
                </form>
            </div>

            <!-- Data List -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold text-slate-900 mb-4">Daftar Ruangan Tersimpan</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-slate-500 text-sm">
                                <th class="py-3 px-4">Gedung / Lantai</th>
                                <th class="py-3 px-4">Nama Ruang</th>
                                <th class="py-3 px-4">Luas</th>
                                <th class="py-3 px-4">Permukaan</th>
                                <th class="py-3 px-4">Catatan</th>
                                <th class="py-3 px-4 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="roomTableBody" class="text-sm divide-y divide-slate-100">
                            <!-- Data akan dimuat disini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw0t3vA-Dn4ObxsTANZQC9lRKnFZime-u3uPHaH2B999eSltFlKCBVe200c4XPmY3JZ/exec";
        let currentUser = localStorage.getItem("currentUser") || null;
        let records = JSON.parse(localStorage.getItem("localRecords") || "[]");

        window.onload = function() {
            if (currentUser) {
                showApp();
                syncWithServer();
            }
            window.addEventListener('online', updateOnlineStatus);
            window.addEventListener('offline', updateOnlineStatus);
            updateOnlineStatus();
        }

        function updateOnlineStatus() {
            const status = document.getElementById("syncStatus");
            if (navigator.onLine) {
                status.innerText = "Online";
                status.className = "text-xs bg-emerald-600 px-2 py-1 rounded-full text-white";
                syncWithServer();
            } else {
                status.innerText = "Offline (Tersimpan Lokal)";
                status.className = "text-xs bg-amber-600 px-2 py-1 rounded-full text-white";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const pin = document.getElementById("pin").value;

            try {
                let response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "login", username, pin })
                });
                let result = await response.json();
                if (result.status === "success") {
                    currentUser = username;
                    localStorage.setItem("currentUser", currentUser);
                    records = result.records || [];
                    localStorage.setItem("localRecords", JSON.stringify(records));
                    showApp();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Gagal terhubung ke server. Periksa koneksi internet.");
            }
        }

        function logout() {
            localStorage.removeItem("currentUser");
            currentUser = null;
            document.getElementById("appSection").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
        }

        function showApp() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appSection").classList.remove("hidden");
            renderTable();
        }

        function toggleExtraFields() {
            const extra = document.getElementById("extraFields");
            const btn = document.getElementById("toggleBtn");
            if (extra.classList.contains("hidden")) {
                extra.classList.remove("hidden");
                btn.innerText = "- Sembunyikan kolom tambahan";
            } else {
                extra.classList.add("hidden");
                btn.innerText = "+ Tampilkan Nama Gedung, Lantai & Catatan";
            }
        }

        function saveRoom(e) {
            e.preventDefault();
            const id = document.getElementById("editId").value || Date.now().toString();
            const gedung = document.getElementById("gedung").value;
            const lantai = document.getElementById("lantai").value;
            const namaRuang = document.getElementById("namaRuang").value;
            const luas = document.getElementById("luas").value;
            const permukaan = document.getElementById("permukaan").value;
            const catatan = document.getElementById("catatan").value;
            const timestamp = new Date().toISOString();

            const existingIndex = records.findIndex(r => r.id === id);
            const newRecord = { id, gedung, lantai, namaRuang, luas, permukaan, catatan, timestamp };

            if (existingIndex >= 0) {
                records[existingIndex] = newRecord;
            } else {
                records.push(newRecord);
            }

            localStorage.setItem("localRecords", JSON.stringify(records));
            document.getElementById("roomForm").reset();
            document.getElementById("editId").value = "";
            renderTable();
            syncWithServer();
        }

        function renderTable() {
            const tbody = document.getElementById("roomTableBody");
            tbody.innerHTML = "";
            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-slate-400">Belum ada data tersimpan.</td></tr>`;
                return;
            }
            records.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4">${r.gedung || '-'}/${r.lantai || '-'}</td>
                        <td class="py-3 px-4 font-medium">${r.namaRuang}</td>
                        <td class="py-3 px-4">${r.luas} m²</td>
                        <td class="py-3 px-4">${r.permukaan}</td>
                        <td class="py-3 px-4 text-slate-500">${r.catatan || '-'}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="editRecord('${r.id}')" class="text-blue-600 hover:underline mr-2">Edit</button>
                            <button onclick="deleteRecord('${r.id}')" class="text-red-600 hover:underline">Hapus</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editRecord(id) {
            const r = records.find(item => item.id === id);
            if (!r) return;
            document.getElementById("editId").value = r.id;
            document.getElementById("namaRuang").value = r.namaRuang;
            document.getElementById("luas").value = r.luas;
            document.getElementById("permukaan").value = r.permukaan;
            document.getElementById("gedung").value = r.gedung || "";
            document.getElementById("lantai").value = r.lantai || "";
            document.getElementById("catatan").value = r.catatan || "";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRecord(id) {
            if (confirm("Yakin ingin menghapus data ini?")) {
                records = records.filter(item => item.id !== id);
                localStorage.setItem("localRecords", JSON.stringify(records));
                renderTable();
                syncWithServer();
            }
        }

        async function syncWithServer() {
            if (!navigator.onLine || !currentUser) return;
            try {
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "sync", username: currentUser, records })
                });
            } catch (err) {
                console.log("Sync background gagal, dicoba lagi nanti.");
            }
        }
    </script>
</body>
</html>
